name: Build publications

on:
  push:
    paths:
      - "assets/publication/publications.md"
      - "build-publications.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static publication list
        run: node build-publications.js

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain index.html sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sitemap.xml
            git commit -m "Update publications from markdown"
            git push
          else
            echo "No changes to commit."
          fi
